<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة التوقف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg1:#0b0c0f;--bg2:#1c1e23;--card:rgba(72,76,86,.32);--line:rgba(190,198,212,.30);--ink:#e9ebef;--dim:#a9afbb;--accent:#c9cdd5;--hi:rgba(200,206,218,.15);--up:#4ade80;--down:#f472b6}
*{box-sizing:border-box;margin:0}
html{font-size:1.04vw;background:#0b0c0f}
body{min-height:100vh;color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;background:radial-gradient(120% 90% at 80% 0%,var(--bg2),var(--bg1) 70%);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;padding:4rem 4.5rem;display:flex;flex-direction:column;gap:2rem;min-height:100vh;justify-content:center;transition:transform 2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem}
.top{display:grid;grid-template-columns:1fr 30rem;gap:2rem;align-items:center}
.next{padding:1.4rem 1.6rem;display:flex;flex-direction:column;gap:.6rem}
.next .h{font-size:.9rem;color:var(--dim)}
.next .n{display:flex;justify-content:space-between;align-items:baseline;font-size:2rem;font-weight:700}
.next .n span:last-child{font-size:1.4rem;font-weight:500}
.next .r{font-size:1.15rem;font-weight:700;color:var(--accent)}
.next .p{font-size:.8rem;color:var(--dim)}
.clock{display:flex;flex-direction:column;align-items:flex-start;gap:1rem}
.time{direction:ltr;font-size:7.5rem;line-height:1;font-weight:500;color:var(--accent);letter-spacing:.02em;text-shadow:0 0 1.6rem rgba(255,255,255,.07)}
.time small{font-size:2rem;margin-inline-start:.6rem;color:var(--dim)}
.meta{display:flex;flex-direction:column;gap:.7rem;font-size:1.25rem;color:var(--dim)}
.meta div{display:flex;gap:1.5rem;align-items:center}
.dhikr{margin-top:.6rem;font-size:1.6rem;line-height:1.6;color:var(--ink);max-width:60rem;min-height:3.4rem;transition:opacity .9s}.dhikr.out{opacity:0}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);padding:.8rem;gap:.6rem}
.pr{text-align:center;padding:1rem .5rem;border-radius:.8rem;border:1px solid transparent}
.pr.on{background:var(--hi);border-color:rgba(210,214,222,.5)}
.pr b{display:block;font-size:1rem;color:var(--dim);font-weight:500;margin-bottom:.5rem}
.pr span{font-size:1.7rem;font-weight:700}
.wx{padding:1rem 1.4rem;display:grid;grid-template-columns:7rem 5.5rem repeat(7,1fr);align-items:center;row-gap:.9rem;font-size:1.1rem}
.wx .hd{color:var(--dim);font-size:.9rem;text-align:center}
.wx .city{font-size:1.25rem;font-weight:500}
.wx .now{display:flex;gap:.4rem;align-items:center;font-size:1.1rem}
.wx .d{display:flex;gap:.5rem;justify-content:center;align-items:center}
.wx .d i{font-style:normal;color:var(--dim)}
.i{width:1.7rem;height:1.7rem;flex:none;vertical-align:middle}
.ic .i{width:1.4rem;height:1.4rem;margin-inline-end:.35rem}
.next .h .i{width:1.1rem;height:1.1rem}
.next{transition:border-color .6s,box-shadow .6s}
.next.iq{border-color:rgba(255,209,102,.75);box-shadow:0 0 2rem rgba(255,209,102,.18)}
.next.iq .r{color:#ffd166}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main id="app">
  <section class="top">
    <div class="clock">
      <div class="time"><span id="t">--:--</span><small id="ap"></small></div>
      <div class="meta">
        <div><span><span class="ic" id="ic-cal"></span> <span id="gd"></span> · <span id="hd"></span></span></div>
        <div><span><span class="ic" id="ic-moon"></span> <span id="rm"></span></span></div>
        <div><span><span class="ic" id="ic-fitr"></span> <span id="ef"></span></span></div>
        <div><span><span class="ic" id="ic-adha"></span> <span id="ea"></span></span></div>
        <div><span><span class="ic" id="ic-school"></span> <span id="sc"></span></span></div>
        <div class="dhikr" id="dk"></div>
      </div>
    </div>
    <div class="card next">
      <div class="h"><span class="ic" id="ic-m"></span><span id="nh">الصلاة القادمة</span></div>
      <div class="n"><span id="nn">--</span><span id="nt"></span></div>
      <div class="r" id="nr"></div>
      <div class="p" id="np"></div>
    </div>
  </section>
  <section class="card prayers" id="prayers"></section>
  <section class="card wx" id="wx"></section>
</main>
<script>
// ===== الإعدادات: عدّل هنا =====
const CFG = {
  bg: 'mix', // stars | snow | grid | mix | none  (أو أضف ?bg=snow آخر الرابط)
  prayer: { city: 'Riyadh', country: 'SA', method: 4 }, // 4 = أم القرى
  iqama: { Fajr: 25, Dhuhr: 20, Asr: 20, Maghrib: 12, Isha: 20 }, // دقايق بين الأذان والإقامة (عدّلها حسب مسجلك)
  alertBefore: 15,   // تنبيه ٣ دقات قبل الأذان بكم دقيقة (0 = إيقاف)
  adhan: 'adhan.mp3', // ملف الأذان: ارفعه في الريبو بجانب هالصفحة
  adhanFajr: '',      // اختياري: أذان الفجر (مثل 'adhan-fajr.mp3')، وإن تُرك فاضي يستخدم الأذان العادي
  volume: 0.8,        // مستوى الصوت من 0 إلى 1
  sound: true,        // false = بدون أصوات (أو أضف ?sound=off للرابط)
  schoolEnd: '2027-06-17', // آخر يوم دراسي (سنة-شهر-يوم) - عدّله حسب تقويم وزارة التعليم
  cities: [
    { n: 'الرياض', lat: 24.7136, lon: 46.6753 },
    { n: 'الطايف', lat: 21.2854, lon: 40.4183 },
    { n: 'مكة', lat: 21.3891, lon: 39.8579 }
  ]
};
// ================================
const AR = '٠١٢٣٤٥٦٧٨٩', ar = s => String(s).replace(/\d/g, d => AR[d]);
const $ = id => document.getElementById(id);
const NAMES = { Fajr: 'الفجر', Dhuhr: 'الظهر', Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء' };
const KEYS = Object.keys(NAMES);
const pad = n => String(n).padStart(2, '0');
const Q = new URLSearchParams(location.search);
let OFFSET = 0; // للتجربة: ?at=11:40 يخلي الساعة تبدأ من هالوقت
if (Q.get('at')) { const [h, m] = Q.get('at').split(':').map(Number), d = new Date(); d.setHours(h, m || 0, 0, 0); OFFSET = d - Date.now(); }
const NOW = () => new Date(Date.now() + OFFSET);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
async function getJSON(url, key) {
  try {
    const r = await fetch(url); if (!r.ok) throw 0;
    const j = await r.json(); store.set(key, j); return j;
  } catch (e) { return store.get(key); }
}
const f12 = d => ar(((d.getHours() % 12) || 12) + ':' + pad(d.getMinutes())) + ' ' + (d.getHours() < 12 ? 'ص' : 'م');
function dur(ms) {
  const m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60), mm = m % 60;
  const hw = h === 1 ? 'ساعة' : h === 2 ? 'ساعتان' : h <= 10 ? ar(h) + ' ساعات' : ar(h) + ' ساعة';
  const mw = mm === 1 ? 'دقيقة' : mm === 2 ? 'دقيقتان' : mm <= 10 ? ar(mm) + ' دقائق' : ar(mm) + ' دقيقة';
  return h ? (mm ? hw + ' و' + mw : hw) : mw;
}
// ----- الصلوات -----
let P = {}; // key dd-mm-yyyy -> {Fajr:Date,...}
const dk = d => pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear();
async function loadPrayers() {
  const base = NOW();
  for (const off of [-1, 0, 1]) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + off);
    const k = dk(d), c = CFG.prayer;
    const j = await getJSON(`https://api.aladhan.com/v1/timingsByCity/${k}?city=${c.city}&country=${c.country}&method=${c.method}`, 'pt' + k);
    if (!j || !j.data) continue;
    const o = {};
    KEYS.forEach(n => {
      const [h, m] = j.data.timings[n].slice(0, 5).split(':').map(Number);
      o[n] = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
    });
    P[k] = o;
  }
}
function renderPrayers() {
  const now = NOW(), ev = [];
  [-1, 0, 1].forEach(off => {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off), p = P[dk(d)];
    if (p) KEYS.forEach(n => ev.push({ n, t: p[n] }));
  });
  if (!ev.length) return;
  ev.sort((a, b) => a.t - b.t);
  const next = ev.find(e => e.t > now), cur = [...ev].reverse().find(e => e.t <= now);
  if (!next) return;
  // بعد الأذان وقبل الإقامة: عدّاد الإقامة. بعدها: عدّاد الأذان القادم
  const iq = cur ? +cur.t + (CFG.iqama[cur.n] || 0) * 60000 : 0, inIq = cur && +now < iq;
  $('nh').textContent = inIq ? 'الإقامة' : 'الصلاة القادمة';
  document.querySelector('.next').classList.toggle('iq', !!inIq);
  let hi;
  if (inIq) {
    hi = cur.n;
    const left = Math.max(0, Math.ceil((iq - now) / 1000));
    $('nn').textContent = NAMES[cur.n]; $('nt').textContent = f12(new Date(iq));
    $('nr').textContent = 'باقي على الإقامة ' + ar(pad(Math.floor(left / 60)) + ':' + pad(left % 60));
    $('np').textContent = now - cur.t < 60000 ? 'أُذِّن الآن' : 'مضى على الأذان ' + dur(now - cur.t);
  } else {
    hi = next.n;
    $('nn').textContent = NAMES[next.n]; $('nt').textContent = f12(next.t);
    $('nr').textContent = 'باقي على الأذان ' + dur(next.t - now);
    $('np').textContent = cur ? 'مضى على ' + NAMES[cur.n] + ' ' + dur(now - cur.t) : '';
  }
  const today = P[dk(now)];
  if (today) $('prayers').innerHTML = KEYS.map(n =>
    `<div class="pr${n === hi ? ' on' : ''}"><b>${NAMES[n]}</b><span>${f12(today[n])}</span></div>`).join('');
}
// ----- التنبيهات الصوتية -----
const SOUND = CFG.sound && Q.get('sound') !== 'off';
function makeBeepUrl() { // ٣ دقات تنبيه مولّدة بالكود، بدون ملفات
  const sr = 22050, beep = .22, gap = .28, n = Math.floor(sr * 3 * (beep + gap));
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / sr, p = t % (beep + gap);
    const a = p < beep ? Math.sin(2 * Math.PI * 880 * t) * .6 * Math.min(1, p / .01, (beep - p) / .02) : 0;
    v.setInt16(44 + i * 2, a * 32767, true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
let beepUrl; const AUD = {};
function playBeeps() {
  if (!SOUND) return;
  try { beepUrl = beepUrl || makeBeepUrl(); const a = new Audio(beepUrl); a.volume = CFG.volume; a.play().catch(() => {}); } catch (e) {}
}
function prep() { // نحمّل الأذان مسبقًا عشان يشتغل بدون تأخير
  [['d', CFG.adhan], ['f', CFG.adhanFajr]].forEach(([k, src]) => {
    if (SOUND && src) { const a = new Audio(src); a.preload = 'auto'; a.volume = CFG.volume; AUD[k] = a; }
  });
}
function playAdhan(n) {
  if (!SOUND) return;
  const a = (n === 'Fajr' && AUD.f) || AUD.d;
  if (!a) return playBeeps(); // ما فيه ملف أذان: ينبّه بالدقات
  a.currentTime = 0; a.play().catch(playBeeps);
}
function alerts() {
  if (!SOUND) return;
  const now = NOW(), key = dk(now), today = P[key];
  if (!today) return;
  let f = store.get('fired'); if (!f || f.d !== key) f = { d: key };
  let changed = false;
  KEYS.forEach(n => {
    const t = +today[n], pre = t - CFG.alertBefore * 60000, x = +now;
    if (CFG.alertBefore && x >= pre && x < pre + 30000 && !f['b' + n]) { f['b' + n] = 1; changed = true; playBeeps(); }
    if (x >= t && x < t + 30000 && !f['a' + n]) { f['a' + n] = 1; changed = true; playAdhan(n); }
  });
  if (changed) store.set('fired', f);
}
// ----- الوقت والتاريخ -----
function hijriParts(d) {
  const p = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: 'numeric', month: 'numeric' }).formatToParts(d);
  return { d: +p.find(x => x.type === 'day').value, m: +p.find(x => x.type === 'month').value };
}
function countdowns(now) {
  const t = { r: [9, 1], f: [10, 1], a: [12, 10] }, out = {};
  for (let i = 0; i < 400; i++) {
    const h = hijriParts(new Date(now.getFullYear(), now.getMonth(), now.getDate() + i));
    for (const k in t) if (out[k] === undefined && h.m === t[k][0] && h.d === t[k][1]) out[k] = i;
  }
  return out;
}
const dayW = n => n === 1 ? 'يوم واحد' : n === 2 ? 'يومان' : n <= 10 ? ar(n) + ' أيام' : ar(n) + ' يومًا';
const cd = (n, name, today) => n === undefined ? '' : n === 0 ? today : 'باقي على ' + name + ' ' + dayW(n);
function tick() {
  const n = NOW();
  $('t').textContent = ar(((n.getHours() % 12) || 12) + ':' + pad(n.getMinutes()));
  $('ap').textContent = n.getHours() < 12 ? 'ص' : 'م';
  renderPrayers(); alerts();
}
function renderDates() {
  const n = NOW();
  $('gd').textContent = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab', { weekday: 'long', day: 'numeric', month: 'long' }).format(n);
  $('hd').textContent = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab', { day: 'numeric', month: 'long', year: 'numeric' }).format(n);
  const c = countdowns(n);
  $('rm').textContent = cd(c.r, 'رمضان', 'اليوم أول رمضان');
  $('ef').textContent = cd(c.f, 'عيد الفطر', 'اليوم عيد الفطر');
  $('ea').textContent = cd(c.a, 'عيد الأضحى', 'اليوم عيد الأضحى');
  const sd = new Date(CFG.schoolEnd + 'T00:00'), td = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const k = Math.round((sd - td) / 864e5);
  $('sc').textContent = k < 0 ? '' : k === 0 ? 'اليوم آخر يوم دراسي' : 'باقي على نهاية السنة الدراسية ' + dayW(k);
}
// ----- الطقس -----
const SV = x => '<svg class="i" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + x + '</svg>';
const G = (c, x) => '<g stroke="' + c + '">' + x + '</g>';
const IC = {
  sun: SV(G('#ffd166', '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>')),
  part: SV(G('#ffd166', '<circle cx="8" cy="8" r="2.8"/><path d="M8 2v1.4M2 8h1.4M3.8 3.8l1 1M12.2 3.8l-1 1"/>') + G('#d6d9df', '<path d="M8 21a3.5 3.5 0 0 1-.4-6.98 4.8 4.8 0 0 1 9.2-.8A4 4 0 0 1 17 21H8z"/>')),
  cloud: SV(G('#d6d9df', '<path d="M6.5 18.5a4 4 0 0 1-.5-7.97 5.5 5.5 0 0 1 10.6-1.3A4.5 4.5 0 0 1 17 18.5H6.5z"/>')),
  fog: SV(G('#aeb4c0', '<path d="M4 7h16M6 11h14M4 15h16M7 19h11"/>')),
  rain: SV(G('#d6d9df', '<path d="M6.5 14.5a4 4 0 0 1-.5-7.97 5.5 5.5 0 0 1 10.6-1.3A4.5 4.5 0 0 1 17 14.5H6.5z"/>') + G('#9fb0c4', '<path d="M8 17.5l-1 3M12 17.5l-1 3M16 17.5l-1 3"/>')),
  snow: SV(G('#d6d9df', '<path d="M6.5 14.5a4 4 0 0 1-.5-7.97 5.5 5.5 0 0 1 10.6-1.3A4.5 4.5 0 0 1 17 14.5H6.5z"/>') + G('#e8eaee', '<path d="M8 18.5v.5M12 20.5v.5M16 18.5v.5M10 22v.5M14 22v.5"/>')),
  bolt: SV(G('#d6d9df', '<path d="M6.5 14.5a4 4 0 0 1-.5-7.97 5.5 5.5 0 0 1 10.6-1.3A4.5 4.5 0 0 1 17 14.5H6.5z"/>') + G('#ffd166', '<path d="M12.5 14.5l-2.5 4h3.5l-2 4"/>')),
  cal: SV(G('#aeb4c0', '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>')),
  moon: SV(G('#ffd166', '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>')),
  star: SV(G('#ffd166', '<path d="M12 3l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16.7 6.4 20.1l1.4-6.3L3 9.5l6.4-.6z"/>')),
  kaaba: SV(G('#e8eaee', '<path d="M5 8l7-3 7 3v11l-7 2-7-2z"/><path d="M5 8l7 3 7-3M12 11v10M5 13l7 3 7-3"/>')),
  mosque: SV(G('#cfd3da', '<path d="M4 21V13h16v8M7 13a5 5 0 0 1 10 0M12 4v3.5M3 21h18M10 21v-3.5a2 2 0 0 1 4 0V21"/>')),
  book: SV(G('#cfd3da', '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/>'))
};
$('ic-cal').innerHTML = IC.cal; $('ic-moon').innerHTML = IC.moon; $('ic-m').innerHTML = IC.mosque; $('ic-fitr').innerHTML = IC.star; $('ic-adha').innerHTML = IC.kaaba;
$('ic-school').innerHTML = IC.book;
const ico = c => c === 0 ? IC.sun : c <= 2 ? IC.part : c === 3 ? IC.cloud : c <= 48 ? IC.fog : c <= 67 ? IC.rain : c <= 77 ? IC.snow : c <= 82 ? IC.rain : IC.bolt;
async function loadWeather() {
  const rows = [];
  for (const c of CFG.cities) {
    const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=7`, 'wx' + c.n);
    if (j) rows.push({ c, j });
  }
  if (!rows.length) return;
  const days = rows[0].j.daily.time.map((t, i) => i === 0 ? 'اليوم' : new Intl.DateTimeFormat('ar-SA-u-ca-gregory', { weekday: 'long' }).format(new Date(t + 'T12:00')));
  let h = '<div></div><div></div>' + days.map(d => `<div class="hd">${d}</div>`).join('');
  rows.forEach(({ c, j }) => {
    h += `<div class="city">${c.n}</div><div class="now">${ico(j.current.weather_code)} ${ar(Math.round(j.current.temperature_2m))}°</div>`;
    h += j.daily.time.map((_, i) => `<div class="d">${ico(j.daily.weather_code[i])}<span>${ar(Math.round(j.daily.temperature_2m_max[i]))}° <i>${ar(Math.round(j.daily.temperature_2m_min[i]))}°</i></span></div>`).join('');
  });
  $('wx').innerHTML = h;
}
// ----- أذكار متغيرة -----
const ADHKAR = [
  'سبحان الله وبحمده، سبحان الله العظيم',
  'لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير',
  'أستغفر الله العظيم وأتوب إليه',
  'لا حول ولا قوة إلا بالله',
  'اللهم صلِّ وسلِّم على نبينا محمد',
  'سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر',
  'حسبي الله لا إله إلا هو عليه توكلت وهو رب العرش العظيم',
  'يا حي يا قيوم برحمتك أستغيث',
  'ربِّ اغفر لي وتب عليَّ إنك أنت التواب الرحيم',
  'سبحان الله وبحمده عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته',
  'اللهم إنك عفوٌّ تحب العفو فاعفُ عني'
];
let di = Math.floor(Math.random() * ADHKAR.length);
function dhikr() {
  const el = $('dk'); el.classList.add('out');
  setTimeout(() => { el.textContent = ADHKAR[di++ % ADHKAR.length]; el.classList.remove('out'); }, 900);
}
// ----- حماية الشاشة من الاحتراق: إزاحة بسيطة كل دقيقة -----
function nudge() { $('app').style.transform = `translate(${(Math.random() * 16 - 8).toFixed(0)}px,${(Math.random() * 16 - 8).toFixed(0)}px)`; }
async function init() {
  prep(); tick(); renderDates(); setInterval(tick, 1000);
  if (Q.get('test') === 'beep') setTimeout(playBeeps, 1500); // تجربة الصوت: ?test=beep أو ?test=adhan
  if (Q.get('test') === 'adhan') setTimeout(() => playAdhan('Dhuhr'), 1500);
  await loadPrayers(); renderPrayers();
  loadWeather(); dhikr(); setInterval(dhikr, 25e3);
  setInterval(loadWeather, 30 * 60e3);
  setInterval(async () => { renderDates(); await loadPrayers(); }, 60 * 60e3);
  setInterval(nudge, 60e3);
}
// ----- الخلفية المتحركة -----
(function () {
  const mode = new URLSearchParams(location.search).get('bg') || CFG.bg;
  const cv = $('bg'), cx = cv.getContext('2d');
  if (mode === 'none' || !cx) return;
  const stars = mode === 'stars' || mode === 'mix', snow = mode === 'snow', grid = mode === 'grid' || mode === 'mix';
  let W, H, items = [], off = 0, last = 0;
  const R = (a, b) => a + Math.random() * (b - a);
  function size() {
    W = cv.width = innerWidth; H = cv.height = innerHeight; items = [];
    const n = snow ? 90 : stars ? 120 : 0;
    for (let i = 0; i < n; i++) items.push({ x: R(0, W), y: R(0, H), r: snow ? R(1, 3.2) : R(.5, 1.9), v: snow ? R(.4, 1.4) : R(.05, .25), p: R(0, 6.28), s: R(.5, 2) });
  }
  function draw(t) {
    requestAnimationFrame(draw);
    if (t - last < 33) return; last = t;
    cx.clearRect(0, 0, W, H);
    if (grid) {
      off = (off + .25) % 70;
      cx.strokeStyle = 'rgba(190,198,212,.06)'; cx.lineWidth = 1; cx.beginPath();
      for (let x = -70 + off; x < W; x += 70) { cx.moveTo(x, 0); cx.lineTo(x, H); }
      for (let y = -70 + off; y < H; y += 70) { cx.moveTo(0, y); cx.lineTo(W, y); }
      cx.stroke();
    }
    items.forEach(o => {
      if (snow) {
        o.y += o.v; o.x += Math.sin(t / 1500 + o.p) * .4;
        if (o.y > H + 5) { o.y = -5; o.x = R(0, W); }
        cx.fillStyle = 'rgba(240,242,246,' + (.35 + o.r / 6) + ')';
      } else {
        o.x += o.v; o.y -= o.v * .3;
        if (o.x > W + 5) o.x = -5; if (o.y < -5) o.y = H + 5;
        cx.fillStyle = 'rgba(225,228,236,' + (.25 + .75 * Math.abs(Math.sin(t / 1000 * o.s + o.p))).toFixed(2) + ')';
      }
      cx.beginPath(); cx.arc(o.x, o.y, o.r, 0, 6.283); cx.fill();
    });
  }
  addEventListener('resize', size); size(); requestAnimationFrame(draw);
})();
init();
</script>
